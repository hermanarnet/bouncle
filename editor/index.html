<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouncle level editor</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  html, body { overflow: auto; height: auto; min-height: 100%; }
  body { display: flex; gap: 20px; padding: 20px; align-items: flex-start; font-size: 14px; color: #fff; background: #1c1544; }
  #wrap { width: 405px; height: 720px; position: relative; flex: none; border-radius: 22px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #cv { width: 100%; height: 100%; display: block; cursor: crosshair; }
  #panel { flex: 1; max-width: 520px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .card h3 { margin: 0; font-size: 15px; color: #fff; }
  .r { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.b { background: #fff; color: #241c5c; border: 0; border-radius: 12px; padding: 8px 12px; font: 600 13px Poppins, sans-serif; cursor: pointer; }
  button.b.y { background: #ffce2c; }
  button.b.r2 { background: #ff5c86; color: #fff; }
  label.f { display: flex; flex-direction: column; font-size: 11px; color: #cfc8f2; gap: 2px; }
  label.f input, select { width: 86px; border-radius: 8px; border: 0; padding: 6px; font: 600 13px Poppins, sans-serif; }
  select { width: auto; }
  #stats { font-variant-numeric: tabular-nums; line-height: 1.6; }
  textarea { width: 100%; height: 120px; border-radius: 10px; border: 0; font: 12px ui-monospace, monospace; padding: 8px; }
  .muted2 { color: #cfc8f2; font-size: 12px; line-height: 1.5; }
  kbd { background: rgba(255,255,255,.15); border-radius: 4px; padding: 0 5px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="panel">
  <div class="card">
    <h3>Level</h3>
    <div class="r">
      <select id="packsel"></select>
      <select id="daysel"></select>
      <button class="b" id="new">New blank</button>
      <select id="theme"><option>toybox</option><option>clay</option><option>frost</option><option>neon</option></select>
    </div>
    <div class="muted2">Drag pieces to move them (rail ends move separately). <kbd>Shift</kbd>+drag on empty space = test shot from the pad. <kbd>Del</kbd> removes the selected piece.</div>
  </div>
  <div class="card">
    <h3>Add</h3>
    <div class="r">
      <button class="b" id="add-rail">+ Rail</button>
      <button class="b" id="add-peg">+ Bumper</button>
      <button class="b" id="add-spin">+ Spinner</button>
      <button class="b" id="add-portal">+ Portal pair</button>
      <button class="b r2" id="del">Delete selected</button>
      <button class="b" id="flip">Mirror level</button>
    </div>
  </div>
  <div class="card">
    <h3>Selected</h3>
    <div class="r" id="props"><span class="muted2">Nothing selected</span></div>
  </div>
  <div class="card">
    <h3>Difficulty check</h3>
    <div class="r"><button class="b y" id="analyze">Simulate 2000 random shots</button><button class="b" id="showsol">Show a winning shot</button></div>
    <div id="stats" class="muted2">–</div>
  </div>
  <div class="card">
    <h3>Export</h3>
    <div class="r"><button class="b" id="copy">Copy level JSON</button><button class="b" id="dl">Download daily.json with this level replaced</button></div>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="r"><button class="b" id="apply">Load JSON from the box</button></div>
  </div>
</div>
<script type="module" src="editor.js"></script>
</body>
</html>
